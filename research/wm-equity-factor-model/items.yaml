  - id: wm-data-001
    category: observation
    status: active
    verification: user_reported_not_independently_verified
    fact: "한국 CIQ 적재본에서 보통주의 11.2%, 288개사가 2026년 6월 결산까지 재무 데이터가 없다는 사용자 관찰. 모집단·조회일·대상 회계기간은 추가 확인 필요."
  - id: wm-data-002
    category: observation
    status: active
    verification: user_reported_not_independently_verified
    fact: "CIQ 영업이익과 금융업 매출의 표준화 정의가 K-IFRS 보고 값과 다르다는 관찰. 영업이익은 약 4곳 중 1곳에서 1% 초과 차이가 있었다고 전달받음."
  - id: wm-data-003
    category: observation
    status: active
    verification: user_reported_not_independently_verified
    fact: "현재 CIQ 적재본에는 섹터 분류 테이블이 없다는 사용자 관찰. 원천 제공 범위와 적재 누락은 아직 구분하지 않음."
  - id: wm-data-004
    category: design_candidate
    status: active
    verification: user_proposal
    fact: "QuantiWise로 국내 지수 구성 종목·비중의 시계열 히스토리를 확보하고, KRX 구성 종목·투자 비중으로 지속 업데이트하는 구상을 검토. QuantiWise와 지수 데이터의 종목 코드 정합성이 장점이라는 사용자 판단."
  - id: wm-data-005
    category: research_requirement
    status: active
    verification: user_concern_and_proposal
    fact: "기존 FnGuide 재무 적재본의 미래 참조와 생존 편향을 우려하며 과거 유실 데이터 보충을 고려. 최초 공개·정정 버전의 시점 재현과 과거 상장폐지 유니버스를 함께 검증해야 함. FnGuide는 원문의 inguide를 문맥상 해석한 표기."
  - id: wm-data-006
    category: research_requirement
    status: active
    verification: user_requested
    fact: "한국 CIQ와 미국 CIQ를 구분해 소스 적합성을 검토. 한국 재무를 CIQ로 일괄 대체하는 결정은 하지 않았음."
  - id: wm-data-007
    category: validation_sample
    status: active
    verification: user_requested
    fact: "삼성전자에 대해 YTD ~ CPD - 1TD 기간의 코스피200 소속 여부, 코스닥150 소속 여부, 거래정지 여부, 관리종목 여부를 확인하는 예시. CPD와 기간 경계의 의미는 확인 필요."
