<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="overview-title"><title id="overview-title">OpenDART 수집에서 온톨로지 v0.1 그래프 생성·검증·Neo4j 조회 및 EC2 배포 준비까지</title><rect width="1280" height="770" fill="#ffffff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7f95a9" /></marker></defs><polyline points="198,281.0 232,281.0" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><polyline points="406,281.0 440,281.0" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><polyline points="614,281.0 648,281.0" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><polyline points="822,281.0 856,281.0" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1030,281.0 1064,281.0" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><polyline points="720,179 720,200 735,200 735,218" fill="none" stroke="#7f95a9" stroke-width="2" marker-end="url(#arrow)" /><text x="24" y="48" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27"><tspan x="24" dy="0" font-weight="600">공시에서 근거 기반 지식그래프까지</tspan></text><text x="24" y="94" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18"><tspan x="24" dy="0" font-weight="600">GUG · OpenDART → Ontology v0.1 → Neo4j Community</tspan></text><rect x="580" y="111" width="280" height="68" rx="10" fill="#f2f4f7" stroke="#bdc7d0" /><text x="596" y="140" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="596" dy="0" font-weight="600">온톨로지 v0.1 · 적용 기준</tspan><tspan x="596" dy="25" font-weight="400">v0.2 / FIBO 매핑은 검토 초안</tspan></text><rect x="24" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="40" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="40" dy="0" font-weight="600">01  수집</tspan><tspan x="40" dy="25" font-weight="400">OpenDART API</tspan><tspan x="40" dy="25" font-weight="400">목록·원문 다운로드</tspan><tspan x="40" dy="25" font-weight="400">캐시 · 누락 기록</tspan></text><rect x="232" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="248" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="248" dy="0" font-weight="600">02  원본 보존</tspan><tspan x="248" dy="25" font-weight="400">ZIP / XML / JSON</tspan><tspan x="248" dy="25" font-weight="400">접수번호·파일 해시</tspan><tspan x="248" dy="25" font-weight="400">16,295건 목록</tspan></text><rect x="440" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="456" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="456" dy="0" font-weight="600">03  필요한 값 추출</tspan><tspan x="456" dy="25" font-weight="400">ACODE / AUNIT 표식</tspan><tspan x="456" dy="25" font-weight="400">수량·비율·기준일</tspan><tspan x="456" dy="25" font-weight="400">개인 / 합산 구분</tspan></text><rect x="648" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="664" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="664" dy="0" font-weight="600">04  그래프 변환</tspan><tspan x="664" dy="25" font-weight="400">v0.1 노드·관계</tspan><tspan x="664" dy="25" font-weight="400">주장 → 근거 → 원문</tspan><tspan x="664" dy="25" font-weight="400">검토 상태 유지</tspan></text><rect x="856" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="872" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="872" dy="0" font-weight="600">05  검증·적재 준비</tspan><tspan x="872" dy="25" font-weight="400">형식 지정 CSV</tspan><tspan x="872" dy="25" font-weight="400">ID·산술·근거 검사</tspan><tspan x="872" dy="25" font-weight="400">중복 없는 재적재</tspan></text><rect x="1064" y="218" width="174" height="126" rx="10" fill="#eff6ff" stroke="#94b7db" /><text x="1080" y="247" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="1080" dy="0" font-weight="600">06  Neo4j 조회</tspan><tspan x="1080" dy="25" font-weight="400">Community 2026.10.1</tspan><tspan x="1080" dy="25" font-weight="400">Cypher · 그래프 탐색</tspan><tspan x="1080" dy="25" font-weight="400">로컬 실행 검증</tspan></text><rect x="24" y="386" width="1214" height="70" rx="10" fill="#eef7f1" stroke="#a5c4af" /><text x="40" y="415" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18"><tspan x="40" dy="0" font-weight="600">현재 검증 범위  ·  기업 5개 / 공시 20건 / 보유현황 40개 / 노드 332개 / 관계 600개</tspan><tspan x="40" dy="25" font-weight="400">모든 결과는 추출 후보 · 원문 전체 의미 분석·최신 지분 확정·자동 투자 판단은 미구현</tspan></text><rect x="24" y="500" width="590" height="105" rx="10" fill="#eef7f1" stroke="#a5c4af" /><text x="40" y="529" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="40" dy="0" font-weight="600">Git으로 공유</tspan><tspan x="40" dy="25" font-weight="400">수집·추출·적재 코드 / 온톨로지 / 예제 설정</tspan><tspan x="40" dy="25" font-weight="400">테스트 / 조회문 / 연구·운영 문서 / 이 다이어그램</tspan></text><rect x="648" y="500" width="590" height="105" rx="10" fill="#fff5e8" stroke="#d8bd96" /><text x="664" y="529" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="664" dy="0" font-weight="600">Git에서 제외</tspan><tspan x="664" dy="25" font-weight="400">전체 원문·파생 데이터 / 실제 Neo4j DB</tspan><tspan x="664" dy="25" font-weight="400">API 키·암호 / 실행 파일·로그 / 결과 ZIP</tspan></text><rect x="24" y="650" width="1214" height="96" rx="10" fill="#f2f4f7" stroke="#bdc7d0" /><text x="40" y="679" fill="#23374d" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14"><tspan x="40" dy="0" font-weight="600">다음 실행 환경  ·  AWS EC2 (배포 준비 단계)</tspan><tspan x="40" dy="25" font-weight="400">git pull = 코드 갱신  ·  데이터·인증정보는 별도 구성  ·  DB·원문은 EBS에 보존</tspan><tspan x="40" dy="25" font-weight="400">Mac ARM64 실행 파일을 EC2 x86_64로 복사하지 않음</tspan></text></svg>