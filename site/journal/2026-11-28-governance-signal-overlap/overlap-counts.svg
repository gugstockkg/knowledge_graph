<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title desc">
<title id="title">전략별 겹침 집계</title><desc id="desc">CLEAR 신규 1/3, 활성 1/11, 매수 3/10. TRACE 신규 3/11, 활성 6/45, 매수 0/7.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d72"/></marker></defs>
<rect x="1" y="1" width="898" height="283" rx="16" fill="#f7fbfc" stroke="#bfced6"/>
<g font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#18394a">
<text x="450" y="36" text-anchor="middle" font-size="25" font-weight="700">전략별 공시 겹침과 매수 주문</text>
<text x="450" y="68" text-anchor="middle" font-size="16" font-weight="400">분자는 겹친 종목·거래일 또는 주문, 분모는 각 조건의 전체 수</text>
<rect x="45" y="94" width="370" height="53" rx="10" fill="#e9f4f8" stroke="#789cae"/>
<text x="230.0" y="122" text-anchor="middle" font-size="20" font-weight="700">신규 공급계약 신호</text>
<text x="230.0" y="144" text-anchor="middle" font-size="15" font-weight="400"></text>
<text x="545" y="126" text-anchor="middle" font-size="23" font-weight="700">1 / 3</text>
<text x="750" y="126" text-anchor="middle" font-size="23" font-weight="700">3 / 11</text>
<rect x="45" y="154" width="370" height="53" rx="10" fill="#e9f4f8" stroke="#789cae"/>
<text x="230.0" y="182" text-anchor="middle" font-size="20" font-weight="700">활성 공급계약 신호</text>
<text x="230.0" y="204" text-anchor="middle" font-size="15" font-weight="400"></text>
<text x="545" y="186" text-anchor="middle" font-size="23" font-weight="700">1 / 11</text>
<text x="750" y="186" text-anchor="middle" font-size="23" font-weight="700">6 / 45</text>
<rect x="45" y="214" width="370" height="53" rx="10" fill="#e9f4f8" stroke="#789cae"/>
<text x="230.0" y="242" text-anchor="middle" font-size="20" font-weight="700">신규 매수와 최근 5거래일 공시</text>
<text x="230.0" y="264" text-anchor="middle" font-size="15" font-weight="400"></text>
<text x="545" y="246" text-anchor="middle" font-size="23" font-weight="700">3 / 10</text>
<text x="750" y="246" text-anchor="middle" font-size="23" font-weight="700">0 / 7</text>
<text x="545" y="91" text-anchor="middle" font-size="17" font-weight="700">CLEAR</text>
<text x="750" y="91" text-anchor="middle" font-size="17" font-weight="700">TRACE</text>
</g></svg>
