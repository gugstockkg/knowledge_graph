<rect x="579" y="50" width="118" height="42" rx="8" fill="#e4f3ef" stroke="#84aaa0"/><text x="638.0" y="76" font-size="17" font-weight="700">원문 공시</text>
<path d="M129 71H287" stroke="#35675f" stroke-width="2" marker-end="url(#arrow)"/><text x="208.0" y="56" font-size="12" font-weight="700">SUPPLIER_ORIGINAL</text>
<path d="M433 71H579" stroke="#35675f" stroke-width="2" marker-end="url(#arrow)"/><text x="506.0" y="56" font-size="12" font-weight="700">EXTRACTED_FROM</text>
<text x="360" y="122" font-size="17" fill="#833a27" font-weight="700">하락 규칙 · 50/82 종목·거래일 하락 · 신뢰도 61.0%</text>
