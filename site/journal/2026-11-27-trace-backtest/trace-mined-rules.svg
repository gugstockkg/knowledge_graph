<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" role="img" aria-labelledby="title desc">
<title id="title">TRACE가 채굴한 공급사 공시 경로 두 가지</title>
<desc id="desc">공급사의 신규 계약과 정정 계약이 각각 원문 공시로 이어진다. 두 경로 모두 다음 거래일 하락 규칙으로 채택됐다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#35675f"/></marker></defs>
