<g font-size="21" font-weight="700"><text x="201" y="54">미국 · SPY</text><text x="559" y="54">한국 · KODEX 200</text><text x="380" y="165">11개월 원화 수익률 비교</text><text x="201" y="261">미국 수익률 ≥ 한국</text><text x="559" y="261">한국 수익률 &gt; 미국</text><text x="380" y="368" fill="white">목표 비중으로 주문하고 체결을 기록</text></g>
<g font-size="17"><text x="201" y="79">조정 종가에 환율 반영</text><text x="559" y="79">원화 조정 종가</text><text x="201" y="287">미국 65% · 한국 15% · 현금 20%</text><text x="559" y="287">미국 35% · 한국 45% · 현금 20%</text><text x="380" y="391" fill="#d7e5f9">진입 · 우위 변경 · 분기말에 판단, 이후 시가에 집행</text></g>
