<title id="title">한·미 상대강도 배분과 주문</title>
<desc id="desc">두 ETF의 11개월 원화 수익률을 비교하고 우위 국가에 15%포인트를 이동한다. 다음 체결 가능 시가로 집행한 주문의 가격과 수량을 원장에 기록한다.</desc>
