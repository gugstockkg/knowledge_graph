<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 233" role="img"><title>수집·평가 기간과 월말 시작 평가창</title><rect width="1000" height="233" rx="18" fill="#f6f9fc"/><g font-family="system-ui, sans-serif" fill="#142b45"><text x="36" y="34" font-size="24" font-weight="700">데이터 수집과 투자 평가</text><rect x="36" y="59" width="287" height="78" rx="9" fill="#e0edf9"/><text x="179.5" y="90" font-size="19" text-anchor="middle" font-weight="700">원자료와 추세 준비</text><text x="179.5" y="115" font-size="15" text-anchor="middle">2015년 2월~2026년 11월</text><text x="343" y="104" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="363" y="59" width="259" height="78" rx="9" fill="#e0edf9"/><text x="492.5" y="90" font-size="19" text-anchor="middle" font-weight="700">월말마다 새 계좌</text><text x="492.5" y="115" font-size="15" text-anchor="middle">2016년 1월부터</text><text x="640" y="104" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="660" y="59" width="305" height="78" rx="9" fill="#d8eee7"/><text x="812.5" y="90" font-size="19" text-anchor="middle" font-weight="700">평가 종료 후 집계</text><text x="812.5" y="115" font-size="15" text-anchor="middle">12개월 118개 · 24개월 106개</text><text x="36" y="174" font-size="17" font-weight="700">예시 · 2022년 4월 진입</text><line x1="282" y1="170" x2="962" y2="170" stroke="#6f90ab" stroke-width="3"/><text x="495" y="208" font-size="17" >2023년 4월 · 12개월</text><text x="750" y="208" font-size="17" >2024년 4월 · 24개월</text></g></svg>
