<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 171" role="img"><title>월말 신호에서 매매와 손익까지</title><rect width="1000" height="171" rx="18" fill="#f6f9fc"/><g font-family="system-ui, sans-serif" fill="#142b45"><text x="36" y="36" font-size="24" font-weight="700">모든 전략은 같은 체결·비용 모형을 사용</text><rect x="32" y="58" width="201" height="80" rx="9" fill="#e0edf9"/><text x="132.5" y="89" font-size="19" text-anchor="middle" font-weight="700">정보 확인</text><text x="132.5" y="114" font-size="15" text-anchor="middle">월말 시세 · 환율</text><text x="251" y="107" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="272" y="58" width="201" height="80" rx="9" fill="#e0edf9"/><text x="372.5" y="89" font-size="19" text-anchor="middle" font-weight="700">목표 비중</text><text x="372.5" y="114" font-size="15" text-anchor="middle">보유 · 추세 · 상대강도</text><text x="492" y="107" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="513" y="58" width="201" height="80" rx="9" fill="#e0edf9"/><text x="613.5" y="89" font-size="19" text-anchor="middle" font-weight="700">주문·체결</text><text x="613.5" y="114" font-size="15" text-anchor="middle">시장별 다음 거래일 시가</text><text x="733" y="107" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="754" y="58" width="212" height="80" rx="9" fill="#d8eee7"/><text x="860" y="89" font-size="19" text-anchor="middle" font-weight="700">계좌 성과</text><text x="860" y="114" font-size="15" text-anchor="middle">원화 손익 · 낙폭</text></g></svg>
