<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 257" role="img"><title>SPY 실제 구성 종목이 애플 주문을 바꾼 경로</title><rect width="1000" height="257" rx="18" fill="#f6f9fc"/><g font-family="system-ui, sans-serif" fill="#142b45"><text x="35" y="36" font-size="24" font-weight="700">간접 보유를 합산해 애플 매수 한도를 계산</text><rect x="33" y="59" width="209" height="79" rx="9" fill="#e0edf9"/><text x="137.5" y="90" font-size="19" text-anchor="middle" font-weight="700">혼합 포트폴리오</text><text x="137.5" y="115" font-size="15" text-anchor="middle">SPY 목표 비중 40%</text><text x="263" y="110" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="282" y="59" width="185" height="79" rx="9" fill="#e0edf9"/><text x="374.5" y="90" font-size="19" text-anchor="middle" font-weight="700">SPY</text><text x="374.5" y="115" font-size="15" text-anchor="middle">N-PORT 제출본</text><text x="485" y="110" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="505" y="59" width="210" height="79" rx="9" fill="#e0edf9"/><text x="610" y="90" font-size="19" text-anchor="middle" font-weight="700">애플 보통주</text><text x="610" y="115" font-size="15" text-anchor="middle">ETF 내 비중 7.07%</text><text x="733" y="110" font-size="27" text-anchor="middle" fill="#48657e">→</text><rect x="753" y="59" width="214" height="79" rx="9" fill="#d8eee7"/><text x="860" y="90" font-size="19" text-anchor="middle" font-weight="700">애플 발행 기업</text><text x="860" y="115" font-size="15" text-anchor="middle">직접 보유와 합산</text><rect x="33" y="160" width="934" height="66" rx="9" fill="#e8eef7"/><text x="55" y="188" font-size="19" font-weight="700">간접 노출 2.83% + 개별주 목표 3.33% = 약 6.16%</text><text x="55" y="213" font-size="17" >기업 한도 6% 적용 → 2022년 7월 1일 애플 매수 0.00959주 → 0.00519주</text></g></svg>
