<path d="M472 325 V178" fill="none" stroke="#31577a" stroke-width="2" marker-end="url(#arrow)"/><text x="534" y="253" fill="#31577a" font-size="12" font-weight="700" paint-order="stroke" stroke="#f6f9fd" stroke-width="5" stroke-linejoin="round">ASSERTED_IN</text>
<path d="M365 358 H244" fill="none" stroke="#31577a" stroke-width="2" marker-end="url(#arrow)"/><text x="304" y="347" fill="#31577a" font-size="12" font-weight="700" paint-order="stroke" stroke="#f6f9fd" stroke-width="5" stroke-linejoin="round">ABOUT_EVENT</text>
