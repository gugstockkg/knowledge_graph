<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 480" role="img" aria-labelledby="title desc">
<title id="title">최대주주 변경 온톨로지 핵심 그래프</title>
<desc id="desc">공시는 회사, 사건, 원문 버전에 연결된다. 주장은 사건과 출처 공시, 원문 위치에 연결된다. 정정 공시는 원공시를, 정정 주장은 이전 주장을 가리킨다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="1" y="1" width="942" height="478" rx="18" fill="#f6f9fd" stroke="#cbd5e1"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="472" y="36" fill="#0f2742" font-size="20" font-weight="700">최대주주 변경과 정정 이력</text>
<path d="M365 130 H244" fill="none" stroke="#31577a" stroke-width="2" marker-end="url(#arrow)"/><text x="304" y="119" fill="#31577a" font-size="12" font-weight="700" paint-order="stroke" stroke="#f6f9fd" stroke-width="5" stroke-linejoin="round">IS_ABOUT</text>
