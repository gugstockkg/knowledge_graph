<rect x="365" y="100" width="214" height="78" rx="12" fill="#fff" stroke="#7095b5"/><text x="472" y="131" fill="#0f2742" font-size="16" font-weight="700">Filing</text><text x="472" y="155" fill="#31577a" font-size="15">접수 공시</text>
