name: Publish research site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_research_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build_research_site.py "${{ runner.temp }}/research-site"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/research-site
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
